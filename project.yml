name: Limor Ai App
options:
  bundleIdPrefix: com.rani
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: TFG2H9C76N
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 8.0.0

targets:
  Limor Ai App:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: "Limor Ai App"
      - path: Shared
    info:
      path: "Limor Ai App/Info.plist"
      properties:
        CFBundleDisplayName: Limor
        UILaunchStoryboardName: LaunchScreen
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        NSLocationWhenInUseUsageDescription: לימור משתמשת במיקום שלך כדי להציג מזג אוויר רלוונטי.
        NSCalendarsFullAccessUsageDescription: לימור צריכה גישה ליומן כדי לעזור לך לנהל פגישות, להציע תזכורות חכמות, ולענות על "מה ביומן שלי".
        NSRemindersFullAccessUsageDescription: לימור שומרת תזכורות גם באפליקציית Reminders של אפל כדי שתראה אותן בכל מקום.
        NSContactsUsageDescription: לימור צריכה גישה לאנשי הקשר כדי שתוכל למצוא טלפונים ולהבין על מי אתה מדבר.
        NSHealthShareUsageDescription: לימור משתמשת בנתוני הבריאות שלך (צעדים, קלוריות, פעילות) כדי להציג סיכום יומי ולענות על שאלות על הכושר שלך.
        NSHealthUpdateUsageDescription: לימור לא כותבת נתונים ל-Apple Health. המפתח קיים רק כי מסגרת HealthKit דורשת אותו. גישת קריאה בלבד.
        NSPhotoLibraryUsageDescription: כדי לבחור תמונת פרופיל מהאלבום.
        NSMicrophoneUsageDescription: כדי שתוכל לדבר עם לימור בקול במקום להקליד.
        NSSpeechRecognitionUsageDescription: כדי להמיר את מה שאתה אומר לטקסט ולשלוח את זה ללימור.
        NSFaceIDUsageDescription: לאימות לפני גישה ל-CRM כדי להגן על נתוני הלקוחות.
        LIMOR_API_BASE_URL: $(LIMOR_API_BASE_URL)
        # URL scheme for Google Sign-In callback. Value must match
        # REVERSED_CLIENT_ID in GoogleService-Info.plist.
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - com.googleusercontent.apps.1043813835619-j123901uoudhqjqlip0aqm8b3idm6f0s
        # Cloud Run serves over HTTPS — no ATS exception needed.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rani.Limor-Ai-App
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        # Cloud Run backend (region me-west1 = Tel Aviv).
        LIMOR_API_BASE_URL: https://limor-app-backend-1043813835619.me-west1.run.app
    entitlements:
      path: "Limor Ai App/Limor Ai App.entitlements"
      properties:
        com.apple.developer.applesignin:
          - Default
        aps-environment: development
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.security.application-groups:
          - group.com.rani.Limor-Ai-App
    dependencies:
      - target: "Limor Ai App Widget"
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseMessaging
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift

  Limor Ai App Widget:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: "Limor Ai App Widget"
      - path: Shared
    info:
      path: "Limor Ai App Widget/Info.plist"
      properties:
        CFBundleDisplayName: Limor
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rani.Limor-Ai-App.widget
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_EMIT_LOC_STRINGS: YES
        APPLICATION_EXTENSION_API_ONLY: YES
    entitlements:
      path: "Limor Ai App Widget/LimorWidget.entitlements"
      properties:
        com.apple.security.application-groups:
          - group.com.rani.Limor-Ai-App
