			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "# Regenerate BuildInfo.swift with the current git short SHA so the\n# Settings footer reflects what the user is actually running. We\n# write a plain Swift enum that the Sources phase (scheduled after\n# this one) compiles in. Failures fall back to \"dev\" and emit a\n# `warning:` line so the build log explains why if anything trips.\n\nGIT_BIN=$(command -v git || true)\nif [ -z \"$GIT_BIN\" ] && [ -x /usr/bin/git ]; then\n  GIT_BIN=/usr/bin/git\nfi\n\nif [ -z \"$GIT_BIN\" ]; then\n  echo \"warning: [inject-git-sha] git not found on PATH; falling back to 'dev'\"\n  GIT_SHA=\"dev\"\nelse\n  GIT_OUT=$(\"$GIT_BIN\" -C \"${SRCROOT}\" rev-parse --short HEAD 2>&1)\n  GIT_RC=$?\n  if [ $GIT_RC -ne 0 ]; then\n    echo \"warning: [inject-git-sha] git rev-parse failed (rc=$GIT_RC) at ${SRCROOT}: $GIT_OUT\"\n    GIT_SHA=\"dev\"\n  else\n    GIT_SHA=\"$GIT_OUT\"\n  fi\nfi\n\nOUT=\"${SRCROOT}/Limor Ai App/BuildInfo.swift\"\nmkdir -p \"$(dirname \"$OUT\")\"\ncat > \"$OUT\" <<EOF\n// Auto-generated by tools/inject-git-sha.rb on every build.\n// Do not edit by hand; do not commit changes — see .gitignore.\nenum BuildInfo {\n    static let gitSha: String = \"$GIT_SHA\"\n}\nEOF\n\necho \"[inject-git-sha] BuildInfo.gitSha=\\\"$GIT_SHA\\\" → $OUT\"\nexit 0\n";
